name: Auto Build Guides & Interlinks

on:
  push:
    paths:
      - 'guides/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Index and Interlinks
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const guidesDir = path.join(process.cwd(), "guides");
          if (!fs.existsSync(guidesDir)) process.exit(0);

          const files = fs.readdirSync(guidesDir).filter(f => f.endsWith(".html")).sort();

          const articles = files.map(file => {
            const content = fs.readFileSync(path.join(guidesDir, file), "utf8");
            const idMatch = file.match(/^(\d+)/);
            const id = idMatch ? idMatch[1] : "00";

            const titleMatch = content.match(/<title>([^<]+)<\/title>/i);
            const descMatch = content.match(/<meta\s+name=["\x27]description["\x27]\s+content=["\x27]([^"\x27]+)["\x27]/i);

            let title = titleMatch ? titleMatch[1].replace(/(\s*\(.*?\)\s*|(\s*[-|–].*?)$)/i, "").trim() : file.replace(".html", "");
            let desc = descMatch ? descMatch[1] : "Complete step-by-step instructions and safety tips.";

            let category = "Guides";
            const low = file.toLowerCase();
            if (low.includes("otp") || low.includes("verification")) category = "OTP & Verification";
            else if (low.includes("discord")) category = "Discord";
            else if (low.includes("architecture") || low.includes("behind-the-scenes") || low.includes("what-is") || low.includes("how-does")) category = "Architecture";
            else if (low.includes("safe") || low.includes("anonymous") || low.includes("security") || low.includes("privacy")) category = "Security & Privacy";
            else if (low.includes("difference") || low.includes("vs") || low.includes("comparison")) category = "Comparison";

            return { id, title, desc, category, file };
          });

          // 1. UPDATE GUIDE.HTML CARDS
          const guidePath = path.join(process.cwd(), "guide.html");
          if (fs.existsSync(guidePath)) {
            let guideHtml = fs.readFileSync(guidePath, "utf8");
            
            const cardsHtml = articles.map(a => `
      <!-- ARTICLE #${a.id} -->
      <a href="guides/${a.file}" class="card">
        <div>
          <div class="card-top">
            <span class="card-num">#${a.id}</span>
            <span class="tag">${a.category}</span>
          </div>
          <h2>${a.title}</h2>
          <p>${a.desc}</p>
        </div>
        <div class="card-footer">
          <span>5 min read</span>
          <span class="read-more">Read Guide →</span>
        </div>
      </a>`).join("\n");

            guideHtml = guideHtml.replace(/<div class="grid" id="guidesGrid">[\s\S]*?<\/div>/, `<div class="grid" id="guidesGrid">\n${cardsHtml}\n    </div>`);
            guideHtml = guideHtml.replace(/Total Published Guides: \d+/g, `Total Published Guides: ${String(articles.length).padStart(3, "0")}`);
            fs.writeFileSync(guidePath, guideHtml);
          }

          // 2. AUTO INJECT INTERLINKS INSIDE EACH ARTICLE
          articles.forEach((art, index) => {
            const filePath = path.join(guidesDir, art.file);
            let content = fs.readFileSync(filePath, "utf8");

            // Pick 3 related articles automatically
            const otherArticles = articles.filter(a => a.file !== art.file);
            const related = otherArticles.slice(0, 3);

            const interlinksHtml = `
      <!-- AUTO-GENERATED RELATED GUIDES -->
      <div style="margin-top: 40px; padding: 20px; background: #0a0a0a; border: 1px solid #222; border-radius: 12px;">
        <h3 style="margin-top:0; color: var(--gold, #f2dc78); font-size: 16px;">📖 Suggested Related Guides</h3>
        <ul style="margin: 0; padding-left: 20px;">
          ${related.map(r => `<li style="margin-bottom: 8px;"><a href="${r.file}" style="color: #fff; font-weight: 600;">${r.title}</a> <span style="color:#777; font-size:12px;">(#${r.id} - ${r.category})</span></li>`).join("\n          ")}
        </ul>
      </div>`;

            if (content.includes("<!-- AUTO-GENERATED RELATED GUIDES -->")) {
              content = content.replace(/<!-- AUTO-GENERATED RELATED GUIDES -->[\s\S]*?<\/div>/, interlinksHtml.trim());
            } else if (content.includes("</article>")) {
              content = content.replace("</article>", `${interlinksHtml}\n    </article>`);
            }
            fs.writeFileSync(filePath, content);
          });
          '

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add guide.html guides/*.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-updated guides directory & interlinks [skip ci]" && git push)
